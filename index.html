<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WAR OF WAR</title>
<meta name="theme-color" content="#0f2b23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War of War">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0f2b23;
  --felt-2:#16392f;
  --ink:#08140f;
  --brass:#d2a64a;
  --brass-dim:#8f7231;
  --red:#d2412f;
  --paper:#ece4cf;
  --muted:#8fa89d;
  --display:"Russo One","Arial Black",Impact,sans-serif;
  --body:"Exo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 40%,var(--felt-2),var(--felt) 70%)}

/* ---------- layout ---------- */
.stage{
  position:relative;z-index:1;height:100%;
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 20px);
  display:grid;gap:12px 28px;
  grid-template-columns:minmax(220px,300px) minmax(0,640px);
  grid-template-rows:auto 1fr auto;
  grid-template-areas:
    "ver   title"
    "side  menu"
    "foot  menu";
  justify-content:center;
  max-width:1100px;margin:0 auto;
}
.ver{grid-area:ver;font-family:var(--display);font-size:28px;color:var(--brass);letter-spacing:.02em;align-self:start}
.ver small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:2px}

.balance{
  position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);
  display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;
  background:var(--ink);border:2px solid var(--brass-dim);font-weight:700;font-variant-numeric:tabular-nums;
}
.balance i{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:normal 14px var(--display);color:var(--paper);box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 5px var(--paper)}

/* ---------- title ---------- */
.title{grid-area:title;position:relative;text-align:center;padding:18px 0 16px;border-top:3px solid var(--brass);border-bottom:3px solid var(--brass)}
.title::before,.title::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--brass-dim)}
.title::before{top:5px}.title::after{bottom:5px}
.title h1{margin:0;font:400 clamp(34px,7vw,64px)/1 var(--display);letter-spacing:.05em;text-shadow:0 3px 0 var(--ink)}
.title h1 span{position:relative;display:inline-block;padding:0 .55em}
.title h1 span::before,.title h1 span::after{content:"";position:absolute;bottom:-.1em;width:.55em;height:.28em;border-top:3px solid var(--red);border-bottom:3px solid var(--red);transform:skewX(-45deg)}
.title h1 span::before{left:-.15em}
.title h1 span::after{right:-.15em;transform:skewX(45deg)}
.title p{margin:8px 0 0;font-size:13px;color:var(--muted);letter-spacing:.04em}

/* ---------- profile ---------- */
.side{grid-area:side;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
.nick{
  width:100%;padding:12px 14px;text-align:center;font-weight:700;font-size:18px;
  background:var(--ink);border:2px solid var(--brass);border-radius:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nick:hover,.nick:focus-visible{background:#0c1d17}
.avatar{
  width:clamp(120px,24vw,170px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;font-size:clamp(56px,11vw,80px);
  background:var(--felt-2);border:3px solid var(--brass);
  box-shadow:0 0 0 6px var(--ink),0 0 0 8px var(--brass-dim);
  position:relative;
}
.avatar::after{content:"змінити";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--ink);border:1px solid var(--brass-dim);padding:1px 10px;border-radius:999px;font-size:11px;color:var(--muted)}

/* ---------- menu ---------- */
.menu{grid-area:menu;display:grid;gap:14px;align-content:start;grid-template-columns:1fr 1fr;padding-top:10px}
.btn{
  position:relative;padding:18px 14px;min-height:64px;
  background:var(--ink);border:2px solid var(--brass);border-radius:4px;
  font:400 clamp(16px,2.6vw,22px)/1.15 var(--display);letter-spacing:.02em;text-align:center;
  box-shadow:0 5px 0 var(--brass-dim);
  transition:transform .08s,box-shadow .08s,background .15s;touch-action:manipulation;
}
.btn:hover{background:#0d2019}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brass-dim)}
.btn:focus-visible,.nick:focus-visible,.avatar:focus-visible,.link:focus-visible,.tog:focus-visible,.pick:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.btn.solo{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.btn.solo:hover{background:#dcb458}
.btn.multi{border-color:var(--red);box-shadow:0 5px 0 #7d2419}
.btn.multi:active{box-shadow:0 1px 0 #7d2419}
.btn.wide{grid-column:1/-1;font-size:clamp(16px,2.4vw,20px)}
.btn small{display:block;margin-top:5px;font:500 12px var(--body);letter-spacing:0;opacity:.75}

.foot{grid-area:foot;align-self:end}
.link{
  background:none;border:0;padding:10px 4px;font-size:15px;color:var(--muted);
  border-bottom:1px dashed var(--brass-dim);
}
.link:hover{color:var(--paper)}

/* ---------- dialogs ---------- */
dialog{
  border:2px solid var(--brass);border-radius:4px;background:var(--felt);color:var(--paper);
  padding:0;width:min(440px,calc(100vw - 32px));font-family:var(--body);box-shadow:0 0 0 6px var(--ink),0 20px 60px #000a;
}
dialog::backdrop{background:#030a07cc}
.d-head{padding:14px 18px;border-bottom:2px solid var(--brass);font:400 20px var(--display);background:var(--ink)}
.d-body{padding:18px;display:grid;gap:14px;font-size:15px;line-height:1.45}
.d-body p{margin:0}
.d-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 18px}
.d-foot .btn{padding:10px 18px;min-height:0;font-size:16px;box-shadow:0 3px 0 var(--brass-dim)}
.field{width:100%;padding:12px;background:var(--ink);border:2px solid var(--brass-dim);border-radius:4px;color:var(--paper);font:700 18px var(--body);user-select:text;-webkit-user-select:text}
.field:focus{outline:none;border-color:var(--brass)}
.hint{color:var(--muted);font-size:13px}
.err{color:#ff8a78;font-size:13px;min-height:1em}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick{aspect-ratio:1;font-size:30px;background:var(--ink);border:2px solid var(--brass-dim);border-radius:50%}
.pick[aria-pressed="true"]{border-color:var(--brass);background:var(--felt-2);box-shadow:0 0 0 3px var(--brass-dim)}
.empty{padding:22px 10px;text-align:center;border:2px dashed var(--brass-dim);border-radius:4px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #ffffff14}
.tog{width:54px;height:30px;border-radius:999px;background:var(--ink);border:2px solid var(--brass-dim);position:relative;padding:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.tog[aria-checked="true"]{border-color:var(--brass)}
.tog[aria-checked="true"]::after{transform:translateX(24px);background:var(--brass)}

/* ---------- portrait / phones ---------- */
@media (max-width:759px){
  html,body{overflow:auto}
  .stage{
    height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:none;
    grid-template-areas:"ver" "title" "side" "menu" "foot";gap:16px;
  }
  .ver{display:flex;align-items:baseline;gap:10px}
  .ver small{margin:0}
  .side{flex-direction:row;gap:16px;padding:0}
  .avatar{width:96px;font-size:48px;flex:none}
  .avatar::after{display:none}
  .nick{text-align:left}
  .menu{grid-template-columns:1fr}
  .foot{padding-top:8px}
}
@media (max-height:520px) and (min-width:760px){
  .stage{gap:8px 24px}
  .title{padding:10px 0}
  .title p{display:none}
  .btn{min-height:52px;padding:12px}
  .avatar{width:110px;font-size:52px}
}

/* ---------- game ---------- */
#game{position:fixed;inset:0;z-index:10;display:none;background:radial-gradient(ellipse at 50% 40%,var(--felt-2),var(--felt) 70%)}
#game.on{display:block}
#gcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 8px calc(env(safe-area-inset-left,0px) + 10px);background:#08140fe6;border-bottom:2px solid var(--brass-dim)}
.hud .btn{padding:8px 14px;min-height:46px;min-width:46px;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--brass-dim);touch-action:manipulation;transition:none}
.hud .btn:active{transform:none;box-shadow:0 3px 0 var(--brass-dim);filter:brightness(1.5)}
.hud .btn.off{opacity:.4}
.hud .mon{flex:1;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;overflow:hidden;text-overflow:ellipsis}

/* ---------- shop ---------- */
#shop{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,var(--felt-2),var(--felt) 70%)}
#shop.on{display:flex}
.shop-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:#08140fe6;border-bottom:2px solid var(--brass-dim)}
.shop-top .btn{padding:8px 14px;min-height:0;box-shadow:0 3px 0 var(--brass-dim)}
.shop-top h2{flex:1;margin:0;font:normal 22px var(--display);letter-spacing:.04em;color:var(--brass)}
.shop-bal{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 5px;border:2px solid var(--brass-dim);border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.shop-bal i{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:normal 14px var(--display);color:var(--paper);box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 5px var(--paper)}
.shop-tabs{display:flex;gap:8px;padding:12px 14px 6px;overflow-x:auto;scrollbar-width:none}
.shop-tabs button{flex:none;padding:8px 14px;border-radius:999px;border:2px solid var(--brass-dim);background:transparent;color:var(--paper);font:700 14px var(--body)}
.shop-tabs button.on{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.shop-body{flex:1;overflow-y:auto;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
.shop-banner{display:flex;flex-direction:column;gap:4px;margin:6px 0 14px;padding:16px;border:2px solid var(--brass);border-radius:16px;background:linear-gradient(135deg,#d2a64a26,#d2412f1f)}
.shop-banner b{font:normal 18px var(--display);color:var(--brass)}
.shop-banner span{color:var(--muted);font-size:14px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.slot{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--brass-dim);border-radius:16px;background:#ffffff08;opacity:.75}
.slot span{font-size:30px;filter:grayscale(1)}
.slot small{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* ---------- units / cases ---------- */
.pic{display:grid;place-items:center;font-size:34px;line-height:1;flex:none}
.pic img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.deck{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 10px);pointer-events:none}
.card{pointer-events:auto;position:relative;width:78px;min-height:96px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(180deg,#0e251c,#08140f);border:2px solid var(--rc,var(--brass));border-radius:10px;box-shadow:0 4px 0 #000a,inset 0 -22px 20px -16px var(--rc,var(--brass-dim));touch-action:manipulation}
.card .pic{width:46px;height:46px;font-size:30px}
.card b{font:700 11px/1.1 var(--body);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{font:700 12px var(--body);color:var(--brass);font-variant-numeric:tabular-nums}
.card small::before{content:"W ";opacity:.6}
.card:active{filter:brightness(1.5)}
.card.off{opacity:.4}
.drow{display:flex;justify-content:center;gap:8px}
.card.sm{width:64px;flex:0 1 64px;min-width:50px;min-height:62px;padding:4px 2px 4px}
.card.sm b{font-size:10px}
.card .ic{display:block;margin:3px 0 1px;flex:none}
.card.arm{box-shadow:0 0 0 3px #ffd34d,0 4px 0 #000a}
.card small.cd::before{content:""}
html.ingame,html.ingame body{overflow:hidden!important;overscroll-behavior:none}
#game,#game *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card{flex:0 1 78px;min-width:56px}
@media (max-width:430px){
  .drow{gap:5px}
  .deck{gap:5px}
  .card{width:72px;flex-basis:72px;min-height:88px}
  .card .pic{width:40px;height:40px}
  .card.sm{width:56px;flex-basis:56px;min-width:44px;min-height:58px}
  .card.sm b{font-size:9.5px}
}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);z-index:3;max-width:90vw;padding:8px 14px;background:#08140fee;border:2px solid var(--brass);border-radius:999px;font:700 13px var(--body);text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ucard{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:var(--ink);border:2px solid color-mix(in srgb,var(--rc) 45%,#000);border-radius:10px;text-align:center}
.ucard .pic{width:52px;height:52px}
.ucard b{font:700 13px var(--body)}
.ucard small{font:500 11px var(--body);color:var(--muted)}
.ucard .st{font-size:10px;letter-spacing:-.02em}
.ucard em{position:absolute;top:3px;right:6px;font:700 11px var(--body);font-style:normal;color:var(--muted)}
.ucard[aria-pressed="true"]{border-color:var(--rc);box-shadow:0 0 0 2px var(--rc),0 0 18px -2px var(--rc);background:#0e251c}
.urow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid color-mix(in srgb,var(--rc) 50%,#000);border-left:4px solid var(--rc);border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 14%,transparent),transparent)}
.urow .pic{width:44px;height:44px;font-size:28px}
.urow .ui{flex:1;min-width:0;display:grid;gap:2px}
.urow .ui small{color:var(--muted);font-size:12px}
.urow.tap{cursor:pointer}
.urow[aria-pressed="true"]{box-shadow:0 0 0 2px var(--rc),0 0 14px -2px var(--rc)}
.urow .cnt{font:700 16px var(--body);color:var(--rc)}
.case-card{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;padding:18px;border:2px solid var(--brass);border-radius:16px;background:radial-gradient(ellipse at 15% 0%,#d2a64a2e,transparent 60%),linear-gradient(135deg,#0a1a14,#0f2b23)}
.case-art{display:grid;place-items:center;width:150px;height:150px;filter:drop-shadow(0 10px 18px #000a)}
.case-art .pic{width:150px;height:150px;font-size:84px}
.case-info{display:flex;flex-direction:column;justify-content:center;gap:8px;align-items:flex-start}
.case-info b{font:normal 28px var(--display);letter-spacing:.05em;color:var(--brass)}
.case-info span{color:var(--muted);font-size:14px}
.case-list{grid-column:1/-1;display:grid;gap:4px;margin-top:8px}
.crow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;background:#ffffff08;border-left:4px solid var(--rc);font-size:14px}
.crow i{width:8px;height:8px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc)}
.crow span{flex:1}
.crow em{font:700 14px var(--body);font-style:normal;color:var(--rc)}
@media (max-width:560px){.case-card{grid-template-columns:1fr;justify-items:center;text-align:center}.case-info{align-items:center}}
#roll{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 calc(env(safe-area-inset-bottom,0px) + 12px);background:radial-gradient(ellipse at 50% 40%,#16392f,#050d09 78%)}
#roll.on{display:flex}
#roll h2{margin:0;font:normal 30px var(--display);letter-spacing:.12em;color:var(--brass);text-shadow:0 0 18px #d2a64a66}
.reel{position:relative;width:100%;max-width:1100px;overflow:hidden;background:#050d09;border-block:2px solid var(--brass-dim);box-shadow:0 0 40px #000c inset;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.reel::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#ffd34d;box-shadow:0 0 14px 2px #ffd34d;z-index:2}
.strip{display:flex;height:100%;will-change:transform}
.rc{position:relative;flex:none;width:var(--cw);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-right:1px solid #ffffff12;overflow:hidden}
.rc::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,var(--rc),transparent 70%);opacity:.38}
.rc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--rc);box-shadow:0 0 12px var(--rc)}
.rc .pic{width:68%;aspect-ratio:1;font-size:48px;position:relative;z-index:1}
.rc small{position:relative;z-index:1;font:700 11px var(--body);color:#fff;text-shadow:0 1px 2px #000;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{min-height:250px;display:grid;place-items:center;width:100%}
.rev{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 28px;width:min(92vw,360px);text-align:center;border:2px solid var(--rc);border-radius:16px;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--rc) 35%,transparent),transparent 70%),#08140f;box-shadow:0 0 50px -6px var(--rc);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.rev .pic{width:120px;height:120px;font-size:72px;filter:drop-shadow(0 0 16px var(--rc))}
.rev small{font:700 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--rc)}
.rev b{font:normal 22px var(--display)}
.rev p{margin:0;font-size:13px;color:var(--muted)}
.rev .ustat{font:700 13px var(--body);color:var(--paper)}
.rev .flash{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 62%);opacity:0;pointer-events:none;animation:fl 1s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fl{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}
.roll-act{display:flex;gap:10px;min-height:52px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>

<div class="balance" title="Баланс"><i>W</i><span id="balance">1 000</span></div>

<main class="stage">
  <div class="ver">0.13<small>рання версія</small></div>

  <header class="title">
    <h1><span>WAR OF WAR</span></h1>
    <p>Захоплюй точки. Став на перемогу.</p>
  </header>

        const sm = el("small", { textContent: o.cost }), b = el("button", { type: "button", className: "card sm" }, iconEl(o.ic, 44), el("b", { textContent: o.lbl }), sm);
        b.style.setProperty("--rc", o.rc); press(b, o.act); return { ...o, b, sm };
      });
      cards = [...r1, ...r2c];
      deckEl.replaceChildren(el("div", { className: "drow" }, ...r1.map(c => c.b)), el("div", { className: "drow" }, ...r2c.map(c => c.b))); hudBuy = null;
    }
    press($("#g-exit"), () => {
      buzz(); if (dlg.open) return;
      const was = paused; if (!net) paused = true;
      open({ title: "Вийти з бою?", lock: true, body: el("p", { textContent: "Прогрес цього бою буде втрачено." }),
        actions: [{ label: "Грати далі", onClick: () => { paused = was; dlg.close(); } }, { label: "Вийти", primary: true, onClick: () => { dlg.close(); if (net && run) end(false, true); else stop(); } }] });
    });
    addEventListener("resize", () => { if (g.classList.contains("on")) fit(); });

    function start(df, md, mi) {
      diff = df || diff; mode = md || mode; mapi = mi === undefined ? mapi : mi; foeSk = ""; tm = 0; lost = 0; kills = 0; autoT = 0; score = [0, 0, 0];
      g.classList.add("on"); document.documentElement.classList.add("ingame"); field.setRunning(false);
      W = innerWidth; H = innerHeight; hh = $(".hud").offsetHeight;
      const hz = W >= H - hh; cols = hz ? 128 : 80; rows = hz ? 80 : 128;
      if (net) { cols = net.cols; rows = net.rows; }
      cs = 16; fit(); gen(); buildDeck();
      pt = new Float32Array(cols * rows);
      forts = []; shells = []; fxs = []; drones = []; builds = []; drCd = [0, 0, 0]; armed = null; fogC = null; vg = [null, null, null]; vgN = 0;
      seen = [null, new Set(), new Set()]; seenF = [null, new Set(), new Set()]; V = [null, [], []];
      divs = []; sel = []; money = [0, 200, net ? 200 : DIFF[diff].cash]; nid = 1; acc = 0; aiT = DIFF[diff].first; paused = false; run = true;
      if (!net || net.role === "host") [1, 2].forEach(s => { for (let k = 0; k < 4; k++) spawn(s, cities[s - 1]); });
      const c = cities[net && net.role === "guest" ? 1 : 0]; ox = W / 2 - (c.x + .5) * cs; oy = (H + hh) / 2 - (c.y + .5) * cs; clampCam();
      spot(); front(); cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame);
    }
    function stop() {
      run = false; paused = false; armed = null; cancelAnimationFrame(raf); g.classList.remove("on"); document.documentElement.classList.remove("ingame"); ptr.clear(); pinch = 0;   // спершу ховаємо бій, щоб помилка нижче не лишила гравця в матчі
      try { if (net) net.un.forEach(f => { try { f(); } catch (e) { console.warn(e); } }); } catch (e) { console.warn(e); }
      net = null;
      try { cards = []; deckEl.replaceChildren(); } catch (e) { console.warn(e); }
      try { field.setRunning(state.settings.bgAnim); } catch (e) { console.warn(e); }
    }
    function pick() {
      const bt = (t, sub, f) => { const b = el("button", { type: "button", className: "btn" }, t, el("small", { textContent: sub })); b.addEventListener("click", () => { buzz(); f(); }); return b; };
      open({ title: "Режим", body: [
        bt("Бій насмерть", "Захопи всі міста ворога", () => maps("kill")),
        bt("Утримання", "Сірі точки A · B · C: захоплення за 5 с, перший до 1500 балів", () => maps("hold"))
      ], actions: [{ label: "Скасувати" }] });
    }
    function maps(md, cb) {
      const names = { easy: "Легка", normal: "Нормальна", hard: "Складна" }, row = el("div", {});
      row.style.cssText = "display:flex;gap:8px";
      const chips = Object.keys(names).map(k => {
        const b = el("button", { type: "button", className: "btn" + (k === state.diff ? " solo" : ""), textContent: names[k] }); b.style.flex = "1";
        b.addEventListener("click", () => { buzz(); state.diff = k; save(); chips.forEach(c => c.classList.toggle("solo", c === b)); }); return b;
      });
      row.append(...chips);
      const mp = MAPS[md].map((m, i) => { const b = el("button", { type: "button", className: "btn" }, m.name, el("small", { textContent: m.desc })); b.addEventListener("click", () => { buzz(); dlg.close(); cb ? cb(md, i) : deckThen(() => start(state.diff, md, i)); }); return b; });
      open({ title: md === "hold" ? "Утримання" : "Бій насмерть", body: [...(cb ? [] : [el("p", { className: "hint", textContent: "Складність" }), row]), el("p", { className: "hint", textContent: "Мапа" }), ...mp], actions: [{ label: "Назад", onClick: cb ? modes : pick }] });
    }

    /* ---------- мультиплеєр ---------- */
    const mbt = (t, sub, f) => { const b = el("button", { type: "button", className: "btn" }, t, el("small", { textContent: sub })); b.addEventListener("click", () => { buzz(); f(); }); return b; };
    const nick = () => state.profile ? state.profile.nick : "";
    const fail = e => open({ title: "Не вийшло", body: el("p", { textContent: e && e.code === "notfound" ? "Кімнату не знайдено." : e && e.code === "full" ? "Кімната вже зайнята." : e && e.code === "self" ? "Це ваша власна кімната." : e && e.code === "permission-denied" ? "Сервер відхилив запит: опублікуйте оновлені Firestore rules." : "Помилка з’єднання. Спробуйте ще раз." }), actions: [{ label: "Закрити" }] });
    function multi() {
      if (!cloud.mp.ok()) return open({ title: "Мультиплеєр", body: el("p", { textContent: "Для гри по мережі потрібно увійти через Google." }), actions: [{ label: "Зрозуміло" }] });
      open({ title: "Мультиплеєр", body: [
        mbt("Швидкий пошук", "Випадковий суперник", quick),
        mbt("Створити кімнату", "Обираєте режим і мапу, друг вводить код", modes),
        mbt("Приєднатись за кодом", "Код із 4 символів", codeDlg)
      ], actions: [{ label: "Закрити" }] });
    }
    function modes() {
      open({ title: "Режим кімнати", body: [
        mbt("Бій насмерть", "Захопи всі міста", () => maps("kill", (m, i) => host(m, i, false))),
        mbt("Утримання", "Точки A · B · C, до " + GOAL + " балів", () => maps("hold", (m, i) => host(m, i, false)))
      ], actions: [{ label: "Назад", onClick: multi }] });
    }
    function codeDlg() {
      const input = el("input", { className: "field", maxLength: 4, placeholder: "ABCD", autocomplete: "off", spellcheck: false });
      input.style.textTransform = "uppercase";
      open({ title: "Код кімнати", body: [input], actions: [{ label: "Назад", onClick: multi }, { label: "Приєднатись", primary: true, onClick: () => { const c = input.value.trim().toUpperCase(); if (c.length === 4) { dlg.close(); joinRoom(c); } } }] });
    }
    async function host(md, mi, pub) {
      const hz = innerWidth >= innerHeight - 60, c = hz ? 128 : 80, r = hz ? 80 : 128;
      let code; try { code = await cloud.mp.create({ mode: md, map: mi, cols: c, rows: r, pub, nick: nick() }); } catch (e) { return fail(e); }
      const big = el("p", { textContent: code }); big.style.cssText = "font:normal 44px var(--display);letter-spacing:.25em;text-align:center;margin:6px 0";
      let un = () => {};
      open({ title: "Очікуємо суперника", lock: true, body: [big, el("p", { textContent: pub ? "Шукаємо суперника…" : "Надішліть цей код другові." })],
        actions: [{ label: "Скасувати", onClick: () => { un(); cloud.mp.remove(code); dlg.close(); } }] });
      un = cloud.mp.onRoom(code, d => { if (d.status === "playing" && d.guest) { un(); dlg.close(); begin({ role: "host", code, md, mi, cols: c, rows: r }); } });
    }
    async function joinRoom(code) {
      try { const d = await cloud.mp.join(code, nick()); begin({ role: "guest", code, md: d.mode, mi: d.map, cols: d.cols, rows: d.rows }); } catch (e) { fail(e); }
    }
    async function quick() {
      open({ title: "Пошук", body: el("p", { textContent: "Шукаємо відкриту кімнату…" }), actions: [{ label: "Закрити" }] });
      try {
        const d = await cloud.mp.quick(nick());
        if (d) { dlg.close(); return begin({ role: "guest", code: d.id, md: d.mode, mi: d.map, cols: d.cols, rows: d.rows }); }
        host(Math.random() < .5 ? "kill" : "hold", Math.floor(Math.random() * 3), true);
      } catch (e) { fail(e); }
    }
    function begin(i) { deckThen(() => run0(i), 15); }
    function run0(i) {
      net = { ...i, seq: 0, last: 0, q: [], t: 0, ei: 0, evs: [], lastEv: 0, live: false, sync: i.role === "host", rx: performance.now(), done: false, un: [] };
      start(null, i.md, i.mi); net.live = true;
      if (i.role === "guest") sendCmd({ t: "hi" });   // одразу повідомляємо хосту свій скін
      net.un.push(cloud.mp.onRoom(i.code, d => { if (d.status === "done" && run && net && !net.done) { net.done = true; end(i.role === "host" ? d.winner === 1 : d.winner === 2); } }));
      if (i.role === "host") net.un.push(cloud.mp.onCmd(i.code, d => { try { hostCmd(JSON.parse(d.j)); } catch (e) { console.warn(e); } }));
      else net.un.push(cloud.mp.onState(i.code, d => {
        try {
          const o = JSON.parse(d.j);
          for (const ev of o.ev || []) if (ev.i > net.lastEv) { net.lastEv = ev.i; applyEv(ev); }
          if (o.sn) applySnap(o.sn);
        } catch (e) { console.warn(e); }
      }));
    }
    return { start, pick, multi };
  })();

  /* ================= wire up ================= */
  document.querySelectorAll("[data-act]").forEach(b =>
    b.addEventListener("click", () => { buzz(); actions[b.dataset.act](); }));
  $("#nick").addEventListener("click", () => { buzz(); askNick(false); });
  $("#avatar").addEventListener("click", () => { buzz(); askAvatar(); });
  $("#switch").addEventListener("click", () => { buzz(); switchAccount(); });

  document.addEventListener("visibilitychange", () => { if (!document.hidden) cloud.refresh(); });
  addEventListener("online", () => cloud.sync());

  render();
  field.setRunning(state.settings.bgAnim);
  (async () => {
    const r = await cloud.init();
    if (r.state === "off") { if (!state.profile) askNick(true); return; }
    if (r.state === "out") { showLogin(); return; }
    await afterAuth(r);
  })();

  /* ================= PWA ================= */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
