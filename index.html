<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WAR OF WAR</title>
<meta name="theme-color" content="#0f2b23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War of War">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0f2b23;
  --felt-2:#16392f;
  --ink:#08140f;
  --brass:#d2a64a;
  --brass-dim:#8f7231;
  --red:#d2412f;
  --paper:#ece4cf;
  --muted:#8fa89d;
  --display:"Russo One","Arial Black",Impact,sans-serif;
  --body:"Exo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:500;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 40%,var(--felt-2),var(--felt) 70%)}

/* ---------- layout ---------- */
.stage{
  position:relative;z-index:1;height:100%;
  padding:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-right,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 20px);
  display:grid;gap:12px 28px;
  grid-template-columns:minmax(220px,300px) minmax(0,640px);
  grid-template-rows:auto 1fr auto;
  grid-template-areas:
    "ver   title"
    "side  menu"
    "foot  menu";
  justify-content:center;
  max-width:1100px;margin:0 auto;
}
.ver{grid-area:ver;font-family:var(--display);font-size:28px;color:var(--brass);letter-spacing:.02em;align-self:start}
.ver small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:2px}

.balance{
  position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);
  display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;
  background:var(--ink);border:2px solid var(--brass-dim);font-weight:700;font-variant-numeric:tabular-nums;
}
.balance i{width:26px;height:26px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:normal 14px var(--display);color:var(--paper);box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 5px var(--paper)}

/* ---------- title ---------- */
.title{grid-area:title;position:relative;text-align:center;padding:18px 0 16px;border-top:3px solid var(--brass);border-bottom:3px solid var(--brass)}
.title::before,.title::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--brass-dim)}
.title::before{top:5px}.title::after{bottom:5px}
.title h1{margin:0;font:400 clamp(34px,7vw,64px)/1 var(--display);letter-spacing:.05em;text-shadow:0 3px 0 var(--ink)}
.title h1 span{position:relative;display:inline-block;padding:0 .55em}
.title h1 span::before,.title h1 span::after{content:"";position:absolute;bottom:-.1em;width:.55em;height:.28em;border-top:3px solid var(--red);border-bottom:3px solid var(--red);transform:skewX(-45deg)}
.title h1 span::before{left:-.15em}
.title h1 span::after{right:-.15em;transform:skewX(45deg)}
.title p{margin:8px 0 0;font-size:13px;color:var(--muted);letter-spacing:.04em}

/* ---------- profile ---------- */
.side{grid-area:side;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
.nick{
  width:100%;padding:12px 14px;text-align:center;font-weight:700;font-size:18px;
  background:var(--ink);border:2px solid var(--brass);border-radius:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nick:hover,.nick:focus-visible{background:#0c1d17}
.avatar{
  width:clamp(120px,24vw,170px);aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;font-size:clamp(56px,11vw,80px);
  background:var(--felt-2);border:3px solid var(--brass);
  box-shadow:0 0 0 6px var(--ink),0 0 0 8px var(--brass-dim);
  position:relative;
}
.avatar::after{content:"змінити";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--ink);border:1px solid var(--brass-dim);padding:1px 10px;border-radius:999px;font-size:11px;color:var(--muted)}

/* ---------- menu ---------- */
.menu{grid-area:menu;display:grid;gap:14px;align-content:start;grid-template-columns:1fr 1fr;padding-top:10px}
.btn{
  position:relative;padding:18px 14px;min-height:64px;
  background:var(--ink);border:2px solid var(--brass);border-radius:4px;
  font:400 clamp(16px,2.6vw,22px)/1.15 var(--display);letter-spacing:.02em;text-align:center;
  box-shadow:0 5px 0 var(--brass-dim);
  transition:transform .08s,box-shadow .08s,background .15s;
}
.btn:hover{background:#0d2019}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brass-dim)}
.btn:focus-visible,.nick:focus-visible,.avatar:focus-visible,.link:focus-visible,.tog:focus-visible,.pick:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.btn.solo{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.btn.solo:hover{background:#dcb458}
.btn.multi{border-color:var(--red);box-shadow:0 5px 0 #7d2419}
.btn.multi:active{box-shadow:0 1px 0 #7d2419}
.btn.wide{grid-column:1/-1;font-size:clamp(16px,2.4vw,20px)}
.btn small{display:block;margin-top:5px;font:500 12px var(--body);letter-spacing:0;opacity:.75}

.foot{grid-area:foot;align-self:end}
.link{
  background:none;border:0;padding:10px 4px;font-size:15px;color:var(--muted);
  border-bottom:1px dashed var(--brass-dim);
}
.link:hover{color:var(--paper)}

/* ---------- dialogs ---------- */
dialog{
  border:2px solid var(--brass);border-radius:4px;background:var(--felt);color:var(--paper);
  padding:0;width:min(440px,calc(100vw - 32px));font-family:var(--body);box-shadow:0 0 0 6px var(--ink),0 20px 60px #000a;
}
dialog::backdrop{background:#030a07cc}
.d-head{padding:14px 18px;border-bottom:2px solid var(--brass);font:400 20px var(--display);background:var(--ink)}
.d-body{padding:18px;display:grid;gap:14px;font-size:15px;line-height:1.45}
.d-body p{margin:0}
.d-foot{display:flex;gap:10px;justify-content:flex-end;padding:0 18px 18px}
.d-foot .btn{padding:10px 18px;min-height:0;font-size:16px;box-shadow:0 3px 0 var(--brass-dim)}
.field{width:100%;padding:12px;background:var(--ink);border:2px solid var(--brass-dim);border-radius:4px;color:var(--paper);font:700 18px var(--body);user-select:text;-webkit-user-select:text}
.field:focus{outline:none;border-color:var(--brass)}
.hint{color:var(--muted);font-size:13px}
.err{color:#ff8a78;font-size:13px;min-height:1em}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pick{aspect-ratio:1;font-size:30px;background:var(--ink);border:2px solid var(--brass-dim);border-radius:50%}
.pick[aria-pressed="true"]{border-color:var(--brass);background:var(--felt-2);box-shadow:0 0 0 3px var(--brass-dim)}
.empty{padding:22px 10px;text-align:center;border:2px dashed var(--brass-dim);border-radius:4px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid #ffffff14}
.tog{width:54px;height:30px;border-radius:999px;background:var(--ink);border:2px solid var(--brass-dim);position:relative;padding:0;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.tog[aria-checked="true"]{border-color:var(--brass)}
.tog[aria-checked="true"]::after{transform:translateX(24px);background:var(--brass)}

/* ---------- portrait / phones ---------- */
@media (max-width:759px){
  html,body{overflow:auto}
  .stage{
    height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:none;
    grid-template-areas:"ver" "title" "side" "menu" "foot";gap:16px;
  }
  .ver{display:flex;align-items:baseline;gap:10px}
  .ver small{margin:0}
  .side{flex-direction:row;gap:16px;padding:0}
  .avatar{width:96px;font-size:48px;flex:none}
  .avatar::after{display:none}
  .nick{text-align:left}
  .menu{grid-template-columns:1fr}
  .foot{padding-top:8px}
}
@media (max-height:520px) and (min-width:760px){
  .stage{gap:8px 24px}
  .title{padding:10px 0}
  .title p{display:none}
  .btn{min-height:52px;padding:12px}
  .avatar{width:110px;font-size:52px}
}

/* ---------- game ---------- */
#game{position:fixed;inset:0;z-index:10;display:none;background:radial-gradient(ellipse at 50% 40%,var(--felt-2),var(--felt) 70%)}
#game.on{display:block}
#gcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 8px calc(env(safe-area-inset-left,0px) + 10px);background:#08140fe6;border-bottom:2px solid var(--brass-dim)}
.hud .btn{padding:8px 12px;min-height:0;font-size:14px;box-shadow:0 3px 0 var(--brass-dim)}
.hud .btn:disabled{opacity:.4}
.hud .mon{flex:1;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>

<div class="balance" title="Баланс"><i>W</i><span id="balance">1 000</span></div>

<main class="stage">
  <div class="ver">0.11<small>рання версія</small></div>

  <header class="title">
    <h1><span>WAR OF WAR</span></h1>
    <p>Захоплюй точки. Став на перемогу.</p>
  </header>

  <section class="side" aria-label="Профіль">
    <button class="nick" id="nick" type="button" aria-label="Змінити нікнейм">[Нікнейм]</button>
    <button class="avatar" id="avatar" type="button" aria-label="Змінити аватарку">?</button>
  </section>

  <nav class="menu" aria-label="Головне меню">
    <button class="btn solo" data-act="solo" type="button">Самотня війна</button>
    <button class="btn multi" data-act="multi" type="button">Війна в Мультплеєр</button>
    <button class="btn wide" data-act="inventory" type="button">Інвентар</button>
    <button class="btn wide" data-act="settings" type="button">Налаштування</button>
  </nav>

  <footer class="foot">
    <button class="link" id="switch" type="button">Змінити акаунт</button>
  </footer>
</main>

<section id="game" aria-label="Бій">
  <canvas id="gcv"></canvas>
  <div class="hud">
    <button class="btn" id="g-exit" type="button" aria-label="Вийти">✕</button>
    <div class="mon" id="g-mon"></div>
    <button class="btn" id="g-all" type="button">Усі</button>
    <button class="btn solo" id="g-buy" type="button">+ Дивізія 100</button>
    <button class="btn" id="g-pause" type="button" aria-label="Пауза">⏸</button>
  </div>
</section>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="d-head" id="dlg-title"></div>
  <div class="d-body" id="dlg-body"></div>
  <div class="d-foot" id="dlg-foot"></div>
</dialog>

<script type="module">
(() => {
  "use strict";

  /* ================= storage ================= */
  const KEY = "wow.v010";
  const defaults = {
    profile: null,                       // { nick, avatar }
    balance: 1000,
    diff: "easy", awards: {}, pending: [],
    settings: { sound: true, vibrate: true, bgAnim: true }
  };
  let state = load();

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      return {
        ...defaults, ...raw,
        settings: { ...defaults.settings, ...(raw && raw.settings) }
      };
    } catch { return structuredClone(defaults); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

  /* ================= helpers ================= */
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props);
    kids.flat().forEach(k => n.append(k));
    return n;
  };
  const buzz = () => { if (state.settings.vibrate && navigator.vibrate) navigator.vibrate(12); };
  const pend = () => state.pending.reduce((a, b) => a + b, 0);   // нагороди, які ще чекають на сервер
  const MEDALS = { easy: ["🥉", "Перемога: легка"], normal: ["🥈", "Перемога: нормальна"], hard: ["🥇", "Перемога: складна"], blitz: ["⚡", "Бліцкриг: перемога за 6 хв"], iron: ["🛡️", "Залізна стіна: без втрат"] };
  const AVATARS = ["🪖","💂","🧑‍✈️","🥷","🦅","🐺","🦂","🐍","💀","🎖️","🎲","🃏"];

  /* ================= Firebase ================= */
  // Вставте сюди конфіг з Firebase Console → Project settings → Your apps → Web (</>).
  // Поки apiKey/appId містять "ВСТАВ", гра працює локально без хмари.
  const firebaseConfig = {
    apiKey: "AIzaSyAwR9hdQ6LWK0ZKqltnEyIFT3GU7SOmNM4",
    authDomain: "warofwar-df4b6.firebaseapp.com",
    projectId: "warofwar-df4b6",
    storageBucket: "warofwar-df4b6.firebasestorage.app",
    messagingSenderId: "867490092176",
    appId: "1:867490092176:web:48906fbef6666003663415"
  };

  const cloud = (() => {
    const V = "10.14.1", base = "https://www.gstatic.com/firebasejs/" + V + "/";
    const enabled = !/ВСТАВ/.test(firebaseConfig.apiKey + firebaseConfig.appId);
    let A, F, auth, db, user = null, ready = false;
    const ref = () => F.doc(db, "users", user.uid);

    async function loadDoc() {
      const snap = await F.getDoc(ref());
      return snap.exists() ? { state: "in", data: snap.data() } : { state: "in", missing: true };
    }
    // state: "off" (без хмари) | "out" (не увійшли) | "in" (увійшли)
    async function init() {
      if (!enabled) return { state: "off" };
      try {
        const [app, au, fs] = await Promise.all([
          import(base + "firebase-app.js"),
          import(base + "firebase-auth.js"),
          import(base + "firebase-firestore.js")
        ]);
        A = au; F = fs;
        const a = app.initializeApp(firebaseConfig);
        auth = A.getAuth(a); db = F.getFirestore(a);
        user = await new Promise(res => { const un = A.onAuthStateChanged(auth, u => { un(); res(u); }); });
        ready = true;
        return user ? await loadDoc() : { state: "out" };
      } catch (e) { console.warn("Firebase:", e); ready = false; return { state: "off" }; }
    }
    async function signIn() {
      if (!ready) throw { code: "offline" };
      const prov = new A.GoogleAuthProvider();
      prov.setCustomParameters({ prompt: "select_account" });
      try { user = (await A.signInWithPopup(auth, prov)).user; }
      catch (e) {
        if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
          await A.signInWithRedirect(auth, prov); return null;   // після повернення спрацює init()
        }
        throw e;
      }
      return loadDoc();
    }
    async function signOut() {
      if (!ready) return;
      try { await A.signOut(auth); } catch (e) { console.warn("Auth:", e); }
      user = null;
    }
    // створює профіль або оновлює нікнейм/аватарку (баланс клієнт змінити не може — це в rules)
    async function saveProfile(p) {
      if (!ready || !user) return;
      try {
        const snap = await F.getDoc(ref());
        if (snap.exists()) await F.updateDoc(ref(), { nick: p.nick, avatar: p.avatar });
        else await F.setDoc(ref(), { nick: p.nick, avatar: p.avatar, balance: 1000, createdAt: F.serverTimestamp() });
      } catch (e) { console.warn("Firestore:", e); }
    }
    const suggestNick = () => ((user && user.displayName) || "").trim().split(/\s+/)[0].slice(0, 16);
    return { enabled, init, signIn, signOut, saveProfile, suggestNick };
  })();

  /* ================= profile ================= */
  function render() {
    const p = state.profile;
    $("#nick").textContent = p ? p.nick : "[Нікнейм]";
    $("#avatar").textContent = p ? p.avatar : "?";
    $("#balance").textContent = state.balance.toLocaleString("uk-UA");
  }

  /* ================= dialog ================= */
  const dlg = $("#dlg");
  let locked = false;
  function open({ title, body, actions, lock = false }) {
    locked = lock;
    $("#dlg-title").textContent = title;
    const b = $("#dlg-body"), f = $("#dlg-foot");
    b.replaceChildren(...[].concat(body));
    f.replaceChildren(...actions.map(a => {
      const btn = el("button", { type: "button", className: "btn" + (a.primary ? " solo" : ""), textContent: a.label });
      btn.addEventListener("click", () => { buzz(); a.onClick ? a.onClick() : dlg.close(); });
      return btn;
    }));
    if (!dlg.open) dlg.showModal();
  }
  dlg.addEventListener("click", e => { if (e.target === dlg && !locked) dlg.close(); });
  dlg.addEventListener("cancel", e => { if (locked) e.preventDefault(); });

  function askNick(first = false) {
    const input = el("input", {
      className: "field", maxLength: 16, autocomplete: "off", spellcheck: false,
      placeholder: "Наприклад, Сержант", value: state.profile ? state.profile.nick : cloud.suggestNick()
    });
    const err = el("div", { className: "err" });
    const submit = () => {
      const v = input.value.trim().replace(/\s+/g, " ");
      if (v.length < 2) { err.textContent = "Мінімум 2 символи."; input.focus(); return; }
      state.profile = { nick: v, avatar: state.profile ? state.profile.avatar : AVATARS[0] };
      save(); render(); dlg.close(); cloud.saveProfile(state.profile);
    };
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    open({
      lock: first,
      title: first ? "Хто йде у бій?" : "Новий нікнейм",
      body: [el("p", { className: "hint", textContent: "Від 2 до 16 символів. Його бачитимуть інші гравці." }), input, err],
      actions: [
        ...(first ? [] : [{ label: "Скасувати" }]),
        { label: first ? "У бій" : "Зберегти", primary: true, onClick: submit }
      ]
    });
    setTimeout(() => input.focus(), 50);
  }

  function showLogin(msg = "") {
    const err = el("div", { className: "err", textContent: msg });
    open({
      title: "Вхід",
      lock: true,
      body: [
        el("p", { textContent: "Увійдіть через Google, щоб зберегти профіль, баланс та інвентар і грати з будь-якого пристрою." }),
        err
      ],
      actions: [{ label: "Увійти через Google", primary: true, onClick: async () => {
        err.textContent = "";
        try { const r = await cloud.signIn(); if (r) await afterAuth(r); }
        catch (e) {
          err.textContent = e.code === "auth/popup-closed-by-user" ? "Вікно входу закрито. Спробуйте ще раз."
            : e.code === "offline" ? "Немає зʼєднання з Firebase. Перевірте інтернет."
            : "Не вдалося увійти (" + (e.code || "помилка") + ").";
        }
      } }]
    });
  }

  async function afterAuth(r) {
    if (r.data) {                                   // профіль уже є в Firestore
      state.profile = { nick: r.data.nick, avatar: r.data.avatar };
      state.balance = r.data.balance + pend(); save(); render(); dlg.close(); return;
    }
    if (state.profile) {                            // локальний профіль → у хмару
      state.balance = 1000 + pend(); save(); await cloud.saveProfile(state.profile); render(); dlg.close(); return;
    }
    askNick(true);                                  // новий гравець
  }

  function askAvatar() {
    const cur = state.profile ? state.profile.avatar : AVATARS[0];
    const grid = el("div", { className: "picks" });
    AVATARS.forEach(a => {
      const b = el("button", { type: "button", className: "pick", textContent: a, ariaLabel: "Аватарка " + a });
      b.setAttribute("aria-pressed", String(a === cur));
      b.addEventListener("click", () => {
        buzz();
        if (!state.profile) return;
        state.profile.avatar = a; save(); render(); dlg.close(); cloud.saveProfile(state.profile);
      });
      grid.append(b);
    });
    open({ title: "Аватарка", body: grid, actions: [{ label: "Закрити" }] });
  }

  function switchAccount() {
    open({
      title: "Змінити акаунт?",

      easy:   { inc: .8, cash: 100, think: 2.5, first: 8, group: 6, hp: 80, ret: 0,  smart: 0 },
      normal: { inc: 1,  cash: 150, think: 1.8, first: 4, group: 4, hp: 70, ret: 40, smart: 1 },
      hard:   { inc: 1,  cash: 200, think: 1,   first: 2, group: 3, hp: 60, ret: 50, smart: 2 }
    };
    const REW = { easy: 50, normal: 120, hard: 250 };
    const dd = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    // Складність = розум бота, а не гроші: нормальний відводить поранених на лікування й б'є туди,
    // де слабше; складний ще й будує підкріплення в найближчому до фронту місті,
    // добиває слабкі дивізії та щосекунди перенацілює війська.
    function ai() {
      const D = DIFF[diff], mine = divs.filter(d => d.s === 2), foes = divs.filter(d => d.s === 1), cap = cities[1];
      const cen = mine.length ? { x: mine.reduce((a, d) => a + d.x, 0) / mine.length, y: mine.reduce((a, d) => a + d.y, 0) / mine.length } : cap;
      let home = pickBig(2);
      if (D.smart > 1) home = cities.filter(c => c.big && cOwn(c) === 2).sort((a, b) => dd(a, cities[0]) - dd(b, cities[0]))[0] || home;
      if (home && money[2] >= COST && mine.length < CAP) { money[2] -= COST; spawn(2, home); }
      const score = c => D.smart ? dd(c, cen) - (c.big ? 10 : 0) + foes.filter(p => dd(p, c) < 7).length * (D.smart > 1 ? 7 : 3) : dd(c, cap);
      const tg = cities.filter(c => cOwn(c) !== 2).sort((a, b) => score(a) - score(b))[0];
      const th = foes.find(p => cities.some(c => cOwn(c) === 2 && dd(c, p) < 9));
      const prey = D.smart > 1 && foes.find(p => p.hp < 45 && mine.some(m => dd(m, p) < 10));
      const t = th || prey, goal = t ? { x: t.x | 0, y: t.y | 0 } : tg, need = t ? 1 : D.group;
      const ready = mine.filter(d => d.hp >= D.hp && !d.back);
      for (const d of mine) {
        if (D.ret && d.hp < D.ret) d.back = true; else if (d.hp >= 85) { d.back = false; d.rt = false; }
        if (d.back) {
          if (!d.rt) { d.rt = true; const b = cities.filter(c => c.big && cOwn(c) === 2).sort((p, q) => dd(p, d) - dd(q, d))[0]; if (b) goTo(d, b.x, b.y); }
          continue;
        }
        if (d.eng || (!D.smart && d.path.length)) continue;
        if (goal && ready.length >= need && d.hp >= D.hp) goTo(d, goal.x, goal.y);
        else if (!D.ret && !d.path.length && d.hp < 45) { const h0 = pickBig(2); if (h0) goTo(d, h0.x, h0.y); }
      }
    }
    // автоатака: вільна дивізія (без наказу), у радіусі якої є ворог, сама йде в бій
    function auto() {
      for (const d of divs) {
        if (d.path.length || d.back) continue;
        let best = null, bd = ATK;
        for (const e of divs) if (e.s !== d.s) { const q = dd(e, d); if (q < bd) { bd = q; best = e; } }
        if (best && bd > COLL + .15) goTo(d, best.x | 0, best.y | 0);
      }
    }

    function end(win) {
      run = false; let text = win ? "Ворог втратив усі міста." : "Ви втратили всі міста.";
      if (win) {
        const got = [diff]; if (tm < 360) got.push("blitz"); if (!lost) got.push("iron");
        const fresh = got.filter(k => !state.awards[k]), gain = REW[diff] + fresh.length * 50;
        state.awards = { ...state.awards, ...Object.fromEntries(got.map(k => [k, true])) };
        state.pending = [...state.pending, gain]; state.balance += gain; save(); render();
        text += " Нагорода: +" + gain + "." + (fresh.length ? " Нові медалі: " + fresh.map(k => MEDALS[k][0] + " " + MEDALS[k][1]).join(", ") + "." : "");
      }
      open({ title: win ? "Перемога!" : "Поразка", lock: true, body: el("p", { textContent: text }),
        actions: [{ label: "Ще раз", primary: true, onClick: () => { dlg.close(); start(diff); } }, { label: "У меню", onClick: () => { dlg.close(); stop(); } }] });
    }
    function tick(dt) {
      const inc = income(); money[1] += inc[1] * dt; money[2] += inc[2] * dt * DIFF[diff].inc; tm += dt; autoT -= dt; if (autoT <= 0) { autoT = .5; auto(); }
      fight(dt); move(dt);
      acc += dt; if (acc >= .1) { acc = 0; front(); }
      aiT -= dt; if (aiT <= 0) { aiT = DIFF[diff].think; ai(); }
      const n = [0, 0, 0]; cities.forEach(c => n[cOwn(c)]++);
      if (!n[2]) end(true); else if (!n[1]) end(false);
    }

    /* ---------- малювання ---------- */
    function star(X, Y, r) {
      const p = new Path2D();
      for (let k = 0; k < 10; k++) { const a = -1.571 + k * .6283, q = k % 2 ? r * .45 : r; p[k ? "lineTo" : "moveTo"](X + Math.cos(a) * q, Y + Math.sin(a) * q); }
      p.closePath(); return p;
    }
    function draw() {
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.fillStyle = "#1c8cf0"; cx.fillRect(0, 0, W, H);
      cx.translate(ox, oy); cx.drawImage(tex, 0, 0, cols * cs, rows * cs);
      const x0 = Math.max(0, Math.floor(-ox / cs)), x1 = Math.min(cols - 1, Math.floor((W - ox) / cs));
      const y0 = Math.max(0, Math.floor((hh - oy) / cs)), y1 = Math.min(rows - 1, Math.floor((H - oy) / cs));
      cx.lineCap = "round"; cx.lineJoin = "round"; cx.strokeStyle = "rgba(245,230,170,.6)"; cx.lineWidth = Math.max(1.5, cs * .14);
      for (const r of roads) { cx.beginPath(); r.forEach(([x, y], i) => cx[i ? "lineTo" : "moveTo"]((x + .5) * cs, (y + .5) * cs)); cx.stroke(); }
      const hard = new Path2D(), dB = new Path2D(), dR = new Path2D(), r = Math.max(1.6, cs * .27);
      const bord = (x, y, o) => N4.some(([a, b]) => inb(x + a, y + b) && own[idx(x + a, y + b)] && own[idx(x + a, y + b)] !== o);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const i = idx(x, y), o = own[i]; if (!o) continue;
        cx.fillStyle = o === 1 ? "rgba(40,60,255,.07)" : "rgba(255,30,30,.07)"; cx.fillRect(x * cs, y * cs, cs, cs);
        if (x < cols - 1 && own[i + 1] && own[i + 1] !== o) { hard.moveTo((x + 1) * cs, y * cs); hard.lineTo((x + 1) * cs, (y + 1) * cs); }
        if (y < rows - 1 && own[i + cols] && own[i + cols] !== o) { hard.moveTo(x * cs, (y + 1) * cs); hard.lineTo((x + 1) * cs, (y + 1) * cs); }
        // солдати стають на фронті там, де за ними є дивізії: перший ряд — край, другий — за ним
        let dot = false;
        if (bord(x, y, o)) dot = inf[o][i] > .12;
        else if (inf[o][i] > .45) dot = N4.some(([a, b]) => inb(x + a, y + b) && own[idx(x + a, y + b)] === o && bord(x + a, y + b, o));
        if (dot) { const p = o === 1 ? dB : dR, X = (x + .5) * cs, Y = (y + .5) * cs; p.moveTo(X + r, Y); p.arc(X, Y, r, 0, 6.283); }
      }
      cx.strokeStyle = "#0a0a0a"; cx.lineWidth = Math.max(2, cs * .2); cx.stroke(hard);
      cx.fillStyle = "#2a3cf0"; cx.fill(dB); cx.fillStyle = "#f02a2a"; cx.fill(dR);
      for (const c of cities) {
        const X = (c.x + .5) * cs, Y = (c.y + .5) * cs, o = cOwn(c);
        cx.fillStyle = "#ffe81a"; cx.strokeStyle = o === 1 ? "#2a3cf0" : "#f02a2a"; cx.lineWidth = Math.max(1.5, cs * .1);
        if (c === cities[0] || c === cities[1]) { const p = star(X, Y, Math.max(8, cs * .9)); cx.fill(p); cx.stroke(p); }
        else { cx.beginPath(); cx.arc(X, Y, c.big ? Math.max(4, cs * .5) : Math.max(2.5, cs * .3), 0, 6.283); cx.fill(); cx.stroke(); }
      }
      for (const d of divs) {
        const X = d.x * cs, Y = d.y * cs, on = sel.includes(d.id), q = Math.max(3, cs * .22);
        if (on && d.path.length) { cx.strokeStyle = "rgba(255,255,255,.8)"; cx.lineWidth = 1.5; cx.setLineDash([4, 4]); cx.beginPath(); cx.moveTo(X, Y); d.path.forEach(([x, y]) => cx.lineTo((x + .5) * cs, (y + .5) * cs)); cx.stroke(); cx.setLineDash([]); }
        if (on) { cx.strokeStyle = "rgba(255,255,255,.25)"; cx.lineWidth = 1; cx.setLineDash([6, 6]); cx.beginPath(); cx.arc(X, Y, ATK * cs, 0, 6.283); cx.stroke(); cx.setLineDash([]); }
        const w = Math.max(10, cs * 1.1) * (on ? 1.3 : 1), h = w * .6, f = Math.max(0, d.hp / HP), bh = Math.max(2.5, cs * .16);
        cx.fillStyle = d.s === 1 ? "#2a3cf0" : "#f02a2a"; cx.strokeStyle = "#0a0a0a"; cx.lineWidth = Math.max(1.5, cs * .08);
        cx.fillRect(X - w / 2, Y - h / 2, w, h); cx.strokeRect(X - w / 2, Y - h / 2, w, h);
        cx.fillStyle = "#0a0a0a"; cx.fillRect(X - w / 2, Y - h / 2 - bh - 2, w, bh);
        cx.fillStyle = f > .5 ? "#4bd13b" : f > .25 ? "#f0c020" : "#e03020"; cx.fillRect(X - w / 2 + 1, Y - h / 2 - bh - 1, (w - 2) * f, bh - 2);
        if (d.eng) { cx.fillStyle = "#fff"; cx.font = `700 ${h * .8}px sans-serif`; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("✕", X, Y + 1); }
        if (on) { cx.strokeStyle = "#fff"; cx.lineWidth = 2; cx.setLineDash([3, 3]); cx.strokeRect(X - w / 2 - 4, Y - h / 2 - bh - 6, w + 8, h + bh + 10); cx.setLineDash([]); }
      }
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (paused) { cx.fillStyle = "#08140faa"; cx.fillRect(0, 0, W, H); cx.fillStyle = "#ece4cf"; cx.font = "400 32px 'Russo One',sans-serif"; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("ПАУЗА", W / 2, H / 2); }
      const inc = income(), mine = divs.filter(d => d.s === 1).length;
      mon.textContent = Math.floor(money[1]) + " +" + inc[1].toFixed(1).replace(/\.0$/, "") + "/с · " + mine + "/" + CAP;
      buy.disabled = money[1] < COST || mine >= CAP || !pickBig(1);
    }
    function frame(t) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
      if (run && !paused) tick(dt);
      draw();
    }

    /* ---------- керування ---------- */
    const ptr = new Map(); let pinch = 0, moved = false;
    function zoomAt(mx, my, k) {
      const ns = Math.min(40, Math.max(minS(), cs * k)), q = ns / cs;
      ox = mx - (mx - ox) * q; oy = my - (my - oy) * q; cs = ns; clampCam();
    }
    function tap(px, py) {
      if (!run || paused) return;
      const x = (px - ox) / cs, y = (py - oy) / cs, thr = Math.max(.9, 24 / cs);
      const hit = divs.filter(d => d.s === 1).map(d => [d, Math.hypot(d.x - x, d.y - y)]).filter(a => a[1] < thr).sort((a, b) => a[1] - b[1])[0];
      if (hit) { const id = hit[0].id; sel = sel.length === 1 && sel[0] === id ? [] : [id]; buzz(); return; }
      if (!sel.length || x < 0 || y < 0 || x >= cols || y >= rows || !land(idx(x | 0, y | 0))) return;
      buzz();
      sel.forEach((id, k) => {
        const d = divs.find(v => v.id === id); if (!d) return;
        const [a, b] = SPREAD[k % SPREAD.length]; let tx = (x | 0) + a, ty = (y | 0) + b;
        if (!inb(tx, ty) || !land(idx(tx, ty))) { tx = x | 0; ty = y | 0; }
        goTo(d, tx, ty);
      });
    }
    cv.addEventListener("pointerdown", e => {
      cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
      if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
    });
    cv.addEventListener("pointermove", e => {
      const p = ptr.get(e.pointerId); if (!p) return;
      if (ptr.size === 1) {
        const dx = e.clientX - p[0], dy = e.clientY - p[1];
        if (moved || Math.hypot(dx, dy) > 6) { moved = true; ox += dx; oy += dy; clampCam(); p[0] = e.clientX; p[1] = e.clientY; }
      } else {
        p[0] = e.clientX; p[1] = e.clientY; moved = true;
        const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (pinch) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinch); pinch = d;
      }
    });
    const up = e => { const had = ptr.delete(e.pointerId); if (had && !moved && !ptr.size && e.type === "pointerup") tap(e.clientX, e.clientY); if (ptr.size < 2) pinch = 0; if (!ptr.size) moved = false; };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
    $("#g-all").addEventListener("click", () => { buzz(); sel = divs.filter(d => d.s === 1).map(d => d.id); });
    $("#g-pause").addEventListener("click", () => { buzz(); paused = !paused; });
    buy.addEventListener("click", () => {
      const c = pickBig(1); if (!c || money[1] < COST || divs.filter(d => d.s === 1).length >= CAP) return;
      buzz(); money[1] -= COST; spawn(1, c);
    });
    $("#g-exit").addEventListener("click", () => {
      buzz(); const was = paused; paused = true;
      open({ title: "Вийти з бою?", body: el("p", { textContent: "Прогрес цього бою буде втрачено." }),
        actions: [{ label: "Грати далі", onClick: () => { paused = was; dlg.close(); } }, { label: "Вийти", primary: true, onClick: () => { dlg.close(); stop(); } }] });
    });
    addEventListener("resize", () => { if (g.classList.contains("on")) fit(); });

    function start(df) {
      diff = df || diff; tm = 0; lost = 0; autoT = 0;
      g.classList.add("on"); field.setRunning(false);
      W = innerWidth; H = innerHeight; hh = $(".hud").offsetHeight;
      const hz = W >= H - hh; cols = hz ? 128 : 80; rows = hz ? 80 : 128;
      cs = 16; fit(); gen();
      divs = []; sel = []; money = [0, 200, DIFF[diff].cash]; nid = 1; acc = 0; aiT = DIFF[diff].first; paused = false; run = true;
      [1, 2].forEach(s => { for (let k = 0; k < 4; k++) spawn(s, cities[s - 1]); });
      const c = cities[0]; ox = W / 2 - (c.x + .5) * cs; oy = (H + hh) / 2 - (c.y + .5) * cs; clampCam();
      front(); cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame);
    }
    function stop() {
      run = false; cancelAnimationFrame(raf); g.classList.remove("on");
      field.setRunning(state.settings.bgAnim);
    }
    function pick() {
      const bt = (k, t, sub) => {
        const b = el("button", { type: "button", className: "btn" + (k === state.diff ? " solo" : "") }, t, el("small", { textContent: sub }));
        b.addEventListener("click", () => { buzz(); state.diff = k; save(); dlg.close(); start(k); }); return b;
      };
      open({ title: "Складність", body: [
        bt("easy", "Легка", "Пасивний бот · нагорода +50"),
        bt("normal", "Нормальна", "Лікує війська, б'є по слабшому · +120"),
        bt("hard", "Складна", "Швидко реагує, добиває слабких · +250")
      ], actions: [{ label: "Скасувати" }] });
    }
    return { start, pick };
  })();

  /* ================= wire up ================= */
  document.querySelectorAll("[data-act]").forEach(b =>
    b.addEventListener("click", () => { buzz(); actions[b.dataset.act](); }));
  $("#nick").addEventListener("click", () => { buzz(); askNick(false); });
  $("#avatar").addEventListener("click", () => { buzz(); askAvatar(); });
  $("#switch").addEventListener("click", () => { buzz(); switchAccount(); });

  render();
  field.setRunning(state.settings.bgAnim);
  (async () => {
    const r = await cloud.init();
    if (r.state === "off") { if (!state.profile) askNick(true); return; }
    if (r.state === "out") { showLogin(); return; }
    await afterAuth(r);
  })();

  /* ================= PWA ================= */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
